name: Design Studio

on:
  push:
    branches: [main, 'feat/design-studio-*']
  pull_request:
    paths:
      - 'app/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/design-studio.yml'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test app/model.test.mjs app/studio.test.mjs app/library.test.mjs app/specimen.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
