name: Design Studio

on:
  push:
    branches: [main, 'feat/design-studio-*', 'feat/design-simplification-*']
  pull_request:
    paths:
      - 'app/**'
      - 'harness/**'
      - 'public-shell.spec.mjs'
      - 'site-shell.mjs'
      - '*.html'
      - '*/index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/design-studio.yml'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
